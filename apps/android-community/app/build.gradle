plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

android {
    namespace = 'com.gamer.community'
    compileSdk = libs.versions.android.compile.sdk.get().toInteger()
    def communityApiBaseUrl = System.getenv('COMMUNITY_API_BASE_URL') ?: 'http://10.0.2.2:4000'
    def fantasyPetApiBaseUrl = System.getenv('FANTASY_PET_API_BASE_URL') ?: communityApiBaseUrl
    def communityDemoToken = System.getenv('COMMUNITY_DEMO_TOKEN') ?: ''
    def releaseSigning = [
        storeFile: System.getenv('ANDROID_RELEASE_STORE_FILE'),
        storePassword: System.getenv('ANDROID_RELEASE_STORE_PASSWORD'),
        keyAlias: System.getenv('ANDROID_RELEASE_KEY_ALIAS'),
        keyPassword: System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
    ]
    def missingReleaseSigningKeys = releaseSigning.findAll { _, value ->
        value == null || value.trim().isEmpty()
    }.keySet()

    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } &&
        !missingReleaseSigningKeys.isEmpty()) {
        throw new GradleException(
            "Release signing is incomplete. Missing: ${missingReleaseSigningKeys.join(', ')}"
        )
    }

    defaultConfig {
        applicationId = 'com.gamer.community'
        minSdk = libs.versions.android.min.sdk.get().toInteger()
        targetSdk = libs.versions.android.target.sdk.get().toInteger()
        versionCode = 1
        versionName = '0.1.0'

        buildConfigField 'String', 'COMMUNITY_API_BASE_URL', "\"${communityApiBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField 'String', 'FANTASY_PET_API_BASE_URL', "\"${fantasyPetApiBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField 'String', 'COMMUNITY_DEMO_TOKEN', "\"${communityDemoToken.replace('\\', '\\\\').replace('\"', '\\\"')}\""

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    signingConfigs {
        if (missingReleaseSigningKeys.isEmpty()) {
            release {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (missingReleaseSigningKeys.isEmpty()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.material3
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.core.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.compose.ui.test.junit4

    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.junit
}
