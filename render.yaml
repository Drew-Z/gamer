services:
  - type: web
    name: gamer-community-api
    repo: https://github.com/Drew-Z/gamer
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./services/community-api/Dockerfile
    dockerCommand: node services/community-api/src/render-start.js
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - render.yaml
        - services/community-api/**
        - services/pet-generator/**
        - packages/community-contracts/**
        - packages/pet-package-spec/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: verify-full
      - key: AIVEN_CA_CERT_PATH
        value: /etc/secrets/aiven-project-ca.pem
      - key: COMMUNITY_DEMO_TOKEN
        sync: false
      - key: FANTASY_PET_API_BASE_URL
        sync: false
      - key: FANTASY_PET_UPSTREAM_TOKEN
        sync: false
      - key: COMMUNITY_CORS_ALLOWED_ORIGINS
        sync: false
      - key: COMMUNITY_ADMIN_REVIEW_TRUSTED_ORIGINS
        sync: false
      - key: COMMUNITY_RATE_LIMIT_ENABLED
        value: "1"
