name: gamer-boxd

services:
  community-api:
    build:
      context: .
      dockerfile: services/community-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${COMMUNITY_API_PORT:-4000}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AIVEN_CA_CERT_PATH: ${AIVEN_CA_CERT_PATH:-/run/secrets/aiven-ca.pem}
      FANTASY_PET_API_BASE_URL: ${FANTASY_PET_API_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    expose:
      - "${COMMUNITY_API_PORT:-4000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-review:
    build:
      context: .
      dockerfile: apps/admin-review/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${ADMIN_REVIEW_PORT:-4200}
      NODE_ENV: production
      COMMUNITY_API_URL: http://community-api:4000
    expose:
      - "${ADMIN_REVIEW_PORT:-4200}"
    depends_on:
      community-api:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}
    depends_on:
      community-api:
        condition: service_started
      admin-review:
        condition: service_started
