name: Android Community CI

on:
  pull_request:
    paths:
      - "apps/android-community/**"
      - ".github/workflows/android-community-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-community/**"
      - ".github/workflows/android-community-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - name: Run Android unit tests, lint, and debug build
        working-directory: apps/android-community
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain --no-daemon

      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-community-debug-${{ github.sha }}
          path: apps/android-community/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
