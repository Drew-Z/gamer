services:
  community-api:
    environment:
      FANTASY_PET_API_BASE_URL: "http://fantasy-pet-api:8765"
      FANTASY_PET_UPSTREAM_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
      COMMUNITY_DEMO_TOKEN: "${COMMUNITY_DEMO_TOKEN:-}"
      COMMUNITY_RATE_LIMIT_ENABLED: "${COMMUNITY_RATE_LIMIT_ENABLED:-1}"
      COMMUNITY_RATE_LIMIT_WINDOW_MS: "${COMMUNITY_RATE_LIMIT_WINDOW_MS:-60000}"
      COMMUNITY_RATE_LIMIT_WRITE_MAX: "${COMMUNITY_RATE_LIMIT_WRITE_MAX:-4}"
      COMMUNITY_RATE_LIMIT_READ_MAX: "${COMMUNITY_RATE_LIMIT_READ_MAX:-60}"
    depends_on:
      fantasy-pet-api:
        condition: service_started

  fantasy-pet-api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles:
      - fantasy-pet
    working_dir: /workspace/fantasy-pet-rule
    environment:
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /data/uv-cache
      FANTASY_PET_DEMO_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
      FANTASY_PET_DEMO_MAX_ACTIVE_JOBS: "${FANTASY_PET_DEMO_MAX_ACTIVE_JOBS:-1}"
      FANTASY_PET_DEMO_HOURLY_CREATE_LIMIT: "${FANTASY_PET_DEMO_HOURLY_CREATE_LIMIT:-4}"
      FANTASY_PET_DEMO_DAILY_CREATE_LIMIT: "${FANTASY_PET_DEMO_DAILY_CREATE_LIMIT:-12}"
    command:
      - uv
      - run
      - --with-requirements
      - requirements-server.txt
      - python
      - tools/app_server.py
      - --run-root
      - /data/runs
      - --adapter-config
      - /workspace/fantasy-pet-rule/config/adapter-config.server.json
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "8765:8765"
    volumes:
      - ../fantasy-pet-rule:/workspace/fantasy-pet-rule
      - fantasy-pet-runs:/data/runs
      - fantasy-pet-uv-cache:/data/uv-cache

  fantasy-pet-worker-daemon:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles:
      - fantasy-pet
    working_dir: /workspace/fantasy-pet-rule
    environment:
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /data/uv-cache
      FANTASY_PET_DEMO_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
    command:
      - uv
      - run
      - --with-requirements
      - requirements-server.txt
      - python
      - tools/run_server_worker_daemon.py
      - --run-root
      - /data/runs
      - --worker-id
      - fantasy-pet-compose-daemon
      - --max-polls
      - "0"
      - --cycles-per-poll
      - "1"
      - --sleep-seconds
      - "5"
      - --ttl-seconds
      - "900"
      - --action-id
      - idle
      - --adapter-config-name
      - adapter-config.json
      - --adapter-config-source
      - /workspace/fantasy-pet-rule/config/adapter-config.server.json
      - --run-real-invocations
    depends_on:
      fantasy-pet-api:
        condition: service_started
    volumes:
      - ../fantasy-pet-rule:/workspace/fantasy-pet-rule
      - fantasy-pet-runs:/data/runs
      - fantasy-pet-uv-cache:/data/uv-cache

volumes:
  fantasy-pet-runs:
  fantasy-pet-uv-cache:
