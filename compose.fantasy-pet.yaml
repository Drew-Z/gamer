services:
  community-api:
    environment:
      FANTASY_PET_API_BASE_URL: "http://fantasy-pet-api:8765"
    depends_on:
      - fantasy-pet-api

  fantasy-pet-api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles:
      - fantasy-pet
    working_dir: /workspace/fantasy-pet-rule
    environment:
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /data/uv-cache
    command:
      - uv
      - run
      - --with-requirements
      - requirements-server.txt
      - python
      - tools/app_server.py
      - --run-root
      - /data/runs
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "8765:8765"
    volumes:
      - ../fantasy-pet-rule:/workspace/fantasy-pet-rule
      - fantasy-pet-runs:/data/runs
      - fantasy-pet-uv-cache:/data/uv-cache

volumes:
  fantasy-pet-runs:
  fantasy-pet-uv-cache:
