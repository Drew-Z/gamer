services:
  community-api:
    environment:
      FANTASY_PET_API_BASE_URL: "http://fantasy-pet-api:8765"
      FANTASY_PET_UPSTREAM_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
      COMMUNITY_DEMO_TOKEN: "${COMMUNITY_DEMO_TOKEN:-}"
      COMMUNITY_RATE_LIMIT_ENABLED: "${COMMUNITY_RATE_LIMIT_ENABLED:-1}"
      COMMUNITY_RATE_LIMIT_WINDOW_MS: "${COMMUNITY_RATE_LIMIT_WINDOW_MS:-60000}"
      COMMUNITY_RATE_LIMIT_WRITE_MAX: "${COMMUNITY_RATE_LIMIT_WRITE_MAX:-4}"
      COMMUNITY_RATE_LIMIT_READ_MAX: "${COMMUNITY_RATE_LIMIT_READ_MAX:-60}"
    depends_on:
      fantasy-pet-api:
        condition: service_started

  fantasy-pet-api:
    image: "${FANTASY_PET_IMAGE:-desktop-pet-agent:${FANTASY_PET_IMAGE_TAG:-local}}"
    build:
      context: ../fantasy-pet-rule
      dockerfile: Dockerfile
    profiles:
      - fantasy-pet
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      FANTASY_PET_ADAPTER_CONFIG: /run/secrets/fantasy_pet_adapter_config
      FANTASY_PET_DEMO_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
      FANTASY_PET_DEMO_MAX_ACTIVE_JOBS: "${FANTASY_PET_DEMO_MAX_ACTIVE_JOBS:-1}"
      FANTASY_PET_DEMO_HOURLY_CREATE_LIMIT: "${FANTASY_PET_DEMO_HOURLY_CREATE_LIMIT:-4}"
      FANTASY_PET_DEMO_DAILY_CREATE_LIMIT: "${FANTASY_PET_DEMO_DAILY_CREATE_LIMIT:-12}"
    command:
      - python
      - tools/app_server.py
      - --run-root
      - /data/runs
      - --adapter-config
      - /run/secrets/fantasy_pet_adapter_config
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "8765:8765"
    volumes:
      - fantasy-pet-runs:/data/runs
    secrets:
      - fantasy_pet_adapter_config

  fantasy-pet-worker-daemon:
    image: "${FANTASY_PET_IMAGE:-desktop-pet-agent:${FANTASY_PET_IMAGE_TAG:-local}}"
    profiles:
      - fantasy-pet
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      FANTASY_PET_ADAPTER_CONFIG: /run/secrets/fantasy_pet_adapter_config
      FANTASY_PET_DEMO_TOKEN: "${FANTASY_PET_UPSTREAM_TOKEN:-}"
    command:
      - python
      - tools/run_server_worker_daemon.py
      - --run-root
      - /data/runs
      - --worker-id
      - fantasy-pet-compose-daemon
      - --max-polls
      - "0"
      - --cycles-per-poll
      - "1"
      - --sleep-seconds
      - "5"
      - --ttl-seconds
      - "900"
      - --action-id
      - idle
      - --adapter-config-name
      - adapter-config.json
      - --adapter-config-source
      - /run/secrets/fantasy_pet_adapter_config
      - --run-real-invocations
    depends_on:
      fantasy-pet-api:
        condition: service_started
    volumes:
      - fantasy-pet-runs:/data/runs
    secrets:
      - fantasy_pet_adapter_config

volumes:
  fantasy-pet-runs:

secrets:
  fantasy_pet_adapter_config:
    file: "${FANTASY_PET_ADAPTER_CONFIG_FILE:-../fantasy-pet-rule/config/adapter-config.server.example.json}"
