services:
  community-api:
    build:
      context: .
      dockerfile: services/community-api/Dockerfile
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"

  pet-generator:
    build:
      context: .
      dockerfile: services/pet-generator/Dockerfile
    environment:
      PORT: "4100"
    ports:
      - "4100:4100"
